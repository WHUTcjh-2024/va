<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAL Invite Benchmark Stream</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, Microsoft YaHei, sans-serif; background: #080f14; color: #edf2ff; }
    body { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { margin: 0; } .hint, small { color: #aeb9d0; }
    #simulator { min-height: 620px; padding: 46px 7%; box-sizing: border-box; background: radial-gradient(ellipse at top, #152832 0%, #091218 68%); border: 1px solid #172832; }
    .title-line { display: grid; grid-template-columns: 1fr auto 1fr; gap: 34px; align-items: center; margin-bottom: 4px; }
    .title-line::before, .title-line::after { height: 3px; content: ""; background: linear-gradient(90deg, #eff5f5 0 4%, #5d6e76 4% 100%); }
    .title-line::after { transform: scaleX(-1); }
    .invite-title { color: #f5f7f5; font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: .06em; text-shadow: 0 3px 2px #000; }
    .invite-subtitle { margin: 5px 0 42px; color: #9ca9aa; text-align: center; font-size: 18px; }
    .invite-panel { padding: 34px 38px 40px; background: linear-gradient(120deg, #1b2a30, #1c252d); border: 1px solid #22363c; box-shadow: inset 0 0 40px #0c151a; }
    .field-label { margin: 0; color: #f2f5f4; font-size: 28px; font-weight: 800; } .field-help { margin: 7px 0 16px; color: #c1c9c9; font-size: 17px; }
    .code-row { display: grid; grid-template-columns: minmax(280px, 1fr) 82px minmax(240px, .72fr); gap: 14px; align-items: stretch; }
    #code { min-height: 82px; display: flex; justify-content: center; align-items: center; gap: .08em; overflow: hidden; background: #20343b; border: 1px solid #273f46; color: #f5f8f6; font: 800 clamp(42px, 6vw, 64px)/1 Consolas, monospace; letter-spacing: .05em; text-shadow: 0 2px 2px #000; }
    .copy-icon { display: grid; place-items: center; background: #4b5663; border: 2px solid #6d7781; color: #fff; font-size: 36px; } .disable-code { display: grid; place-items: center; background: linear-gradient(90deg, #147864, #1c997e); border: 4px solid #44e7d4; color: #f5ffff; font-size: 25px; font-weight: 800; }
    .join-separator { height: 1px; margin: 42px 0; background: #263940; }
    .join-placeholder { display: grid; grid-template-columns: minmax(280px, 1fr) 82px minmax(240px, .72fr); gap: 14px; height: 78px; } .input-placeholder, .join-button { border: 2px solid #45525a; background: #142129; } .input-placeholder { padding: 15px 24px; color: #7d888b; font-size: 32px; letter-spacing: .15em; } .join-button { display: grid; place-items: center; color: #b3bdbe; font-size: 25px; font-weight: 800; }
    .glyph { flex: 0 0 auto; opacity: 0; transform: translateY(14px); transition: opacity 110ms linear, transform 110ms ease-out; } .glyph.visible { opacity: 1; transform: translateY(0); }
    .benchmark-controls { margin-top: 28px; padding: 18px 22px; background: #111a23; border: 1px solid #26354a; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: grid; gap: 5px; font-size: 14px; } input, button { border: 1px solid #46516b; border-radius: 6px; padding: 9px 11px; font: inherit; }
    input { width: 88px; background: #1a2030; color: inherit; } button { background: #3b72e5; color: white; cursor: pointer; } button:disabled { opacity: .5; cursor: not-allowed; }
    #state { margin: 18px 0; font-weight: 600; } table { width: 100%; border-collapse: collapse; margin-top: 20px; } td, th { padding: 8px; border-bottom: 1px solid #2e374b; text-align: left; }
    @media (max-width: 760px) { #simulator { padding: 32px 5%; } .title-line { grid-template-columns: 1fr; gap: 8px; text-align: center; } .title-line::before, .title-line::after { display: none; } .code-row, .join-placeholder { grid-template-columns: 1fr 64px; } .disable-code, .join-button { display: none; } .invite-panel { padding: 25px 18px; } }
  </style>
</head>
<body>
  <main id="simulator" aria-label="模拟直播间邀请页面">
    <div class="title-line"><h1 class="invite-title">分享组队邀请</h1></div>
    <p class="invite-subtitle">通过专属房间代码发送和接受组队邀请</p>
    <section class="invite-panel">
      <p class="field-label">房间代码</p><p class="field-help">复制你的房间代码，以供分享：</p>
      <div class="code-row"><div id="code" aria-label="邀请码"></div><div class="copy-icon" aria-hidden="true">▣</div><div class="disable-code">禁用邀请码</div></div>
      <div class="join-separator"></div>
      <p class="field-help">粘贴另一个房间代码，即可加入：</p>
      <div class="join-placeholder" aria-hidden="true"><div class="input-placeholder">••••••</div><div class="copy-icon">▣</div><div class="join-button">加入房间</div></div>
    </section>
  </main>
  <section class="benchmark-controls">
    <p class="hint">请通过 localhost 同源打开本页与 <a href="game.html">game.html</a>。完整显示邀请码时记为 T0。</p>
    <div class="controls"><label>回合数<input id="rounds" type="number" min="1" max="10000" value="100"></label><label>Reveal (ms)<input id="revealMs" type="number" min="0" max="10000" value="800"></label><label>Timeout (ms)<input id="timeoutMs" type="number" min="50" max="30000" value="1500"></label><button id="start">开始 Benchmark</button><button id="stop" disabled>停止</button><button id="download" disabled>下载 results.csv</button></div>
  </section>
  <p id="state">等待开始</p>
  <table><thead><tr><th>指标</th><th>值</th></tr></thead><tbody id="summary"></tbody></table>
  <script src="benchmark.js"></script>
  <script>
    (() => {
      const B = window.ValInviteBenchmark;
      const elements = Object.freeze({
        rounds: document.querySelector("#rounds"), revealMs: document.querySelector("#revealMs"), timeoutMs: document.querySelector("#timeoutMs"),
        start: document.querySelector("#start"), stop: document.querySelector("#stop"), download: document.querySelector("#download"),
        code: document.querySelector("#code"), state: document.querySelector("#state"), summary: document.querySelector("#summary"),
      });
      const ambiguousLetters = ["I", "J", "L", "M", "W"];
      const ambiguousDigits = ["1", "3", "7", "8"];
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const digits = "0123456789";
      let activeRun = null;
      let records = [];
      let pendingResult = null;

      const randomItem = (items) => items[Math.floor(Math.random() * items.length)];
      const api = (path, body) => fetch(path, body === undefined ? { cache: "no-store" } : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(response => response.json());
      const setRunning = (running) => {
        elements.start.disabled = running; elements.stop.disabled = !running;
        for (const element of [elements.rounds, elements.revealMs, elements.timeoutMs]) element.disabled = running;
      };
      const renderCode = async (code, revealMs) => {
        elements.code.replaceChildren(...[...code].map((glyph) => {
          const span = document.createElement("span"); span.className = "glyph"; span.textContent = glyph; return span;
        }));
        const glyphs = [...elements.code.children];
        const delay = glyphs.length === 0 ? 0 : revealMs / glyphs.length;
        const order = [2, 3, 1, 4, 0, 5].filter(index => glyphs[index]);
        for (const index of order) { glyphs[index].classList.add("visible"); await B.sleep(delay); }
      };
      const summarise = () => {
        const counts = { correct: 0, wrong: 0, early: 0, timeout: 0 };
        for (const record of records) counts[record.outcome.toLowerCase()]++;
        const latencies = records.filter((record) => record.outcome === "CORRECT").map((record) => record.latency_ms);
        const stats = {
          Rounds: records.length, Correct: counts.correct, Wrong: counts.wrong, EARLY: counts.early, Timeout: counts.timeout,
          "Accuracy (%)": records.length ? B.formatNumber(100 * counts.correct / records.length) : "0.00",
          "Mean (ms)": latencies.length ? B.formatNumber(latencies.reduce((sum, value) => sum + value, 0) / latencies.length) : "",
          "P50 (ms)": B.formatNumber(B.percentile(latencies, .50)), "P95 (ms)": B.formatNumber(B.percentile(latencies, .95)), "P99 (ms)": B.formatNumber(B.percentile(latencies, .99)),
          "Min (ms)": latencies.length ? B.formatNumber(Math.min(...latencies)) : "", "Max (ms)": latencies.length ? B.formatNumber(Math.max(...latencies)) : "",
        };
        elements.summary.replaceChildren(...Object.entries(stats).map(([name, value]) => {
          const row = document.createElement("tr"); row.innerHTML = `<td>${name}</td><td>${value}</td>`; return row;
        }));
        return stats;
      };
      const resultFor = (round, submission) => {
        if (!submission) return { ...round, submitted_code: "", t1_unix_ms: "", latency_ms: "", outcome: "TIMEOUT" };
        const latency = submission.t1_unix_ms - round.t0_unix_ms;
        const outcome = latency < 0 ? "EARLY_SUBMIT" : submission.submitted_code === round.expected_code ? "CORRECT" : "WRONG";
        return { ...round, submitted_code: submission.submitted_code, t1_unix_ms: submission.t1_unix_ms, latency_ms: latency, outcome };
      };
      B.onMessage((message) => {
        if (!activeRun || message.runId !== activeRun.id || message.type !== "submission") return;
        if (message.roundId !== activeRun.roundId || pendingResult) return;
        pendingResult = message;
      });
      const run = async () => {
        const settings = { rounds: Number(elements.rounds.value), revealMs: Number(elements.revealMs.value), timeoutMs: Number(elements.timeoutMs.value), gapMs: B.DEFAULTS.gapMs };
        if (![settings.rounds, settings.revealMs, settings.timeoutMs].every(Number.isFinite) || settings.rounds < 1) return;
        records = []; pendingResult = null; elements.download.disabled = true; setRunning(true);
        const created = await api("/api/run", settings);
        activeRun = { id: created.runId, roundId: 0, stopped: false };
        for (let roundId = 1; roundId <= settings.rounds && !activeRun.stopped; roundId++) {
          activeRun.roundId = roundId; pendingResult = null;
          await api("/api/open", { roundId });
          elements.state.textContent = `Round ${roundId}/${settings.rounds}: reveal 中`;
          const code = await api("/api/code", {});
          await renderCode(code.code, settings.revealMs);
          await api("/api/reveal", {});
          elements.state.textContent = `Round ${roundId}/${settings.rounds}: 已完全显示，等待提交`;
          const deadline = Date.now() + settings.timeoutMs;
          while (!activeRun.stopped && Date.now() < deadline) {
            if ((await api("/api/submitted")).submitted) break;
            await B.sleep(10);
          }
          if (!activeRun.stopped) records.push(await api("/api/close", {}));
          summarise();
          await B.sleep(settings.gapMs + Math.floor(Math.random() * B.DEFAULTS.jitterMs));
        }
        const stopped = activeRun.stopped;
        activeRun = null; setRunning(false); elements.download.disabled = records.length === 0;
        elements.state.textContent = stopped ? "已停止" : `完成：${records.length} rounds`;
      };
      elements.start.addEventListener("click", () => { void run(); });
      elements.stop.addEventListener("click", () => { if (activeRun) activeRun.stopped = true; });
      elements.download.addEventListener("click", () => B.downloadCsv(records, summarise()));
    })();
  </script>
</body>
</html>
